name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download subdistrict PMTiles archive
        run: |
          mkdir -p public
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/UJ1K/opensource-batasadministrasi/releases/download/v1.0.0/kecamatan_admin.pmtiles \
            --output public/kecamatan_admin.pmtiles
      - name: Build site
        run: npm run build
        env:
          VITE_PMTILES_URL: ${{ vars.VITE_PMTILES_URL }}
          VITE_SUBDISTRICT_PMTILES_URL: https://uj1k.github.io/opensource-batasadministrasi/kecamatan_admin.pmtiles
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
